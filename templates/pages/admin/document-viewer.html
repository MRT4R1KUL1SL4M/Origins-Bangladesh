<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; }
    .font-serif { font-family: 'Cormorant Garamond', serif; }
    .viewer-scroll::-webkit-scrollbar{ width: 8px; height: 8px; }
    .viewer-scroll::-webkit-scrollbar-thumb{ background:#d6d0c4; border-radius:999px; }
  </style>
</head>
<body class="bg-[#FAF8F5] text-[#1A1614] min-h-screen">
  <div class="max-w-[1600px] mx-auto p-6 lg:p-8">
    <div class="bg-white border border-[#E8E3DB] rounded-[28px] overflow-hidden shadow-[0_4px_30px_-10px_rgba(0,0,0,0.06)]">
      <div class="px-8 py-6 border-b border-[#E8E3DB] flex items-center justify-between gap-4">
        <div>
          <p class="text-[11px] uppercase tracking-[0.18em] text-[#A39A8E] font-semibold">Admin Document Viewer</p>
          <h1 id="viewer-title" class="font-serif text-4xl leading-none mt-2">Loading…</h1>
          <p class="text-[13px] text-[#6B635A] mt-2">Review uploaded documents in a clean, styled viewer without broken inline PDF embeds.</p>
        </div>
        <button onclick="window.close()" class="px-5 py-2.5 rounded-full border border-[#E8E3DB] text-[13px] font-medium hover:bg-[#FAF8F5] transition-all">Close</button>
      </div>
      <div class="grid grid-cols-12 min-h-[78vh]">
        <aside class="col-span-12 lg:col-span-4 xl:col-span-3 border-r border-[#E8E3DB] bg-[#FCFBF9]">
          <div class="p-5 border-b border-[#E8E3DB]">
            <div class="relative">
              <input id="doc-search" type="text" placeholder="Search documents..." class="w-full rounded-2xl bg-white border border-[#E8E3DB] px-4 py-3 text-[13px] focus:outline-none focus:border-[#C27803]/40" />
            </div>
          </div>
          <div id="doc-list" class="viewer-scroll p-4 space-y-3 overflow-y-auto max-h-[calc(78vh-88px)]"></div>
        </aside>
        <section class="col-span-12 lg:col-span-8 xl:col-span-9 bg-white">
          <div class="px-6 py-4 border-b border-[#E8E3DB] flex items-center justify-between gap-4">
            <div>
              <h2 id="doc-active-title" class="font-serif text-3xl">Select a document</h2>
              <p id="doc-active-meta" class="text-[12px] text-[#A39A8E] mt-1"></p>
            </div>
            <div id="image-controls" class="hidden items-center gap-2">
              <button data-zoom="out" class="px-4 py-2 rounded-full border border-[#E8E3DB] text-[12px] font-medium hover:bg-[#FAF8F5]">Zoom Out</button>
              <button data-zoom="in" class="px-4 py-2 rounded-full border border-[#E8E3DB] text-[12px] font-medium hover:bg-[#FAF8F5]">Zoom In</button>
              <button data-zoom="reset" class="px-4 py-2 rounded-full bg-[#1A1614] text-white text-[12px] font-medium hover:bg-[#C27803]">Reset</button>
            </div>
          </div>
          <div id="doc-stage" class="viewer-scroll h-[calc(78vh-82px)] overflow-auto bg-[#F7F4EF] p-6"></div>
        </section>
      </div>
    </div>
  </div>
  <script>
    window.__DOC_VIEWER__ = { kind: {{ kind|tojson }}, recordId: {{ record_id|tojson }} };
  </script>
  <script src="{{ url_for('static', filename='assets/js/admin-document-viewer.js') }}"></script>
</body>
</html>
